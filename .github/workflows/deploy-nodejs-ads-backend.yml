name: Deploy nodejs-ads-backend

on:
  push:
    branches: [main]
    paths:
      - 'nodejs-ads-backend/**'
      - '.github/workflows/deploy-nodejs-ads-backend.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run: rsync --dry-run, no file writes, no pm2 restart'
        type: boolean
        default: false

concurrency:
  group: deploy-nodejs-ads-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to dev server
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
      REMOTE_USER: ${{ secrets.DEPLOY_USER }}
      REMOTE_PATH: /home/pas-adsgpt-dev-ftp/microservices/AdsScrollServer
      SERVICE_USER: pas-adsgpt-dev-ftp
      PM2_PROCESS: ads-scroller
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            echo "DEPLOY_KNOWN_HOSTS secret not set; scanning $REMOTE_HOST with ssh-keyscan"
            ssh-keyscan -t rsa,ecdsa,ed25519 "$REMOTE_HOST" >> ~/.ssh/known_hosts
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::~/.ssh/known_hosts is empty — set the DEPLOY_KNOWN_HOSTS secret or check that the runner can reach $REMOTE_HOST:22"
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host deploy
            HostName $REMOTE_HOST
            User $REMOTE_USER
            IdentityFile ~/.ssh/deploy_key
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            ConnectTimeout 30
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Sanity-check SSH + server state
        run: |
          ssh deploy "hostname; id; test -d $REMOTE_PATH && echo 'REMOTE_PATH ok' || (echo 'REMOTE_PATH missing!'; exit 2)"

      - name: Rsync source
        # No --delete (repo deletions are not propagated).
        run: |
          RSYNC_FLAGS="-avz --human-readable"
          if [ "$DRY_RUN" = "true" ]; then
            RSYNC_FLAGS="$RSYNC_FLAGS --dry-run"
            echo "### DRY RUN — no files will be written ###"
          fi
          rsync $RSYNC_FLAGS \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='logs/' \
            --exclude='*.log' \
            --exclude='.git/' \
            --exclude='.github/' \
            --rsync-path="sudo -u $SERVICE_USER rsync" \
            nodejs-ads-backend/ \
            deploy:"$REMOTE_PATH/"

      - name: Install dependencies if package.json changed
        if: env.DRY_RUN != 'true'
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null \
               | grep -qE '^nodejs-ads-backend/(package|package-lock)\.json$'; then
            echo "package(-lock).json changed — running npm install on server"
            ssh deploy "sudo -u $SERVICE_USER -H bash -lc '\
              source ~/.nvm/nvm.sh && \
              cd $REMOTE_PATH && \
              npm install --production --no-audit --no-fund'"
          else
            echo "package(-lock).json unchanged — skipping npm install"
          fi

      - name: Restart pm2 process
        if: env.DRY_RUN != 'true'
        run: |
          ssh deploy "sudo -u $SERVICE_USER -H bash -lc '\
            source ~/.nvm/nvm.sh && \
            pm2 restart $PM2_PROCESS --update-env && \
            pm2 save'"

      - name: Health check
        if: env.DRY_RUN != 'true'
        run: |
          sleep 10
          ssh deploy "sudo ss -tlnp | grep ':9090 ' || (echo 'port 9090 not listening'; exit 3)"
          ssh deploy "curl -sS -o /dev/null -w '%{http_code}\n' --max-time 10 http://127.0.0.1:9090/ || (echo 'ads-scroller not reachable'; exit 4)"

      - name: Tail logs
        if: env.DRY_RUN != 'true' && always()
        continue-on-error: true
        run: |
          ssh deploy "sudo -u $SERVICE_USER -H bash -lc '\
            source ~/.nvm/nvm.sh && \
            timeout 30 pm2 logs $PM2_PROCESS --lines 40 --nostream || true; \
            pm2 describe $PM2_PROCESS | grep -E \"restart|status|uptime\" || true'"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
