name: react-frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'react-frontend/**'
      - '.github/workflows/deploy-react-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'react-frontend/**'
      - '.github/workflows/deploy-react-frontend.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run: rsync --dry-run, no build, no pm2 restart'
        type: boolean
        default: false

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('react-frontend-pr-{0}', github.ref) || 'react-frontend-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI (install + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
        # No `cache: npm` — react-frontend has no package-lock.json yet.

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Lint
        # Soft-fail preserves the prior CI behavior — flip to hard-fail once
        # pre-existing warnings are cleaned up.
        run: npm run lint || true

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to dev server
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
      REMOTE_USER: ${{ secrets.DEPLOY_USER }}
      REMOTE_PATH: /home/pas-adsgpt-dev-ftp/new-adsgpt-front-end/adsgpt-front-end
      SERVICE_USER: pas-adsgpt-dev-ftp
      PM2_PROCESS: frontend
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            echo "DEPLOY_KNOWN_HOSTS secret not set; scanning $REMOTE_HOST with ssh-keyscan"
            ssh-keyscan -t rsa,ecdsa,ed25519 "$REMOTE_HOST" >> ~/.ssh/known_hosts
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::~/.ssh/known_hosts is empty — set the DEPLOY_KNOWN_HOSTS secret or check that the runner can reach $REMOTE_HOST:22"
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host deploy
            HostName $REMOTE_HOST
            User $REMOTE_USER
            IdentityFile ~/.ssh/deploy_key
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            ConnectTimeout 30
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Sanity-check SSH + server state
        run: |
          ssh deploy "hostname; id; test -d $REMOTE_PATH && echo 'REMOTE_PATH ok' || (echo 'REMOTE_PATH missing!'; exit 2)"
          ssh deploy "test -f $REMOTE_PATH/.env && echo 'server .env present (VITE_* vars will be used at build time)' || echo 'WARNING: no .env on server — build may produce dev-URL-less bundle'"

      - name: Rsync source
        run: |
          RSYNC_FLAGS="-avz --human-readable"
          if [ "$DRY_RUN" = "true" ]; then
            RSYNC_FLAGS="$RSYNC_FLAGS --dry-run"
            echo "### DRY RUN — no files will be written ###"
          fi
          rsync $RSYNC_FLAGS \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='*.log' \
            --rsync-path="sudo -u $SERVICE_USER rsync" \
            react-frontend/ \
            deploy:"$REMOTE_PATH/"

      - name: Install dependencies on server
        if: env.DRY_RUN != 'true'
        # Always install for the frontend — Vite builds need the full dep
        # tree, and dep-hash comparison is cheaper than a stale-build bug.
        run: |
          ssh deploy "sudo -u $SERVICE_USER -H bash -lc '\
            source ~/.nvm/nvm.sh && \
            cd $REMOTE_PATH && \
            npm install --no-audit --no-fund'"

      - name: Build on server
        if: env.DRY_RUN != 'true'
        # Server .env provides VITE_* vars that get baked into the bundle.
        run: |
          ssh deploy "sudo -u $SERVICE_USER -H bash -lc '\
            source ~/.nvm/nvm.sh && \
            cd $REMOTE_PATH && \
            npm run build'"

      - name: Restart pm2 process
        if: env.DRY_RUN != 'true'
        run: |
          ssh deploy "sudo -u $SERVICE_USER -H bash -lc '\
            source ~/.nvm/nvm.sh && \
            pm2 restart $PM2_PROCESS --update-env && \
            pm2 save'"

      - name: Health check
        if: env.DRY_RUN != 'true'
        run: |
          sleep 5
          ssh deploy "sudo ss -tlnp | grep ':6000 ' || (echo 'port 6000 not listening'; exit 3)"
          ssh deploy "curl -sS -o /dev/null -w '%{http_code}\n' --max-time 10 http://127.0.0.1:6000/ || (echo 'frontend not reachable'; exit 4)"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
