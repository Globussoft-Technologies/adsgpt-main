name: Deploy react-admin

on:
  push:
    branches: [main]
    paths:
      - 'react-admin/**'
      - '.github/workflows/deploy-react-admin.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run: rsync --dry-run, no build, no pm2 restart'
        type: boolean
        default: false

concurrency:
  group: deploy-react-admin
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to dev server
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
      REMOTE_USER: ${{ secrets.DEPLOY_USER }}
      REMOTE_PATH: /home/pas-adsgpt-dev-ftp/new-adsgpt-admin/adsgpt-admin
      SERVICE_USER: pas-adsgpt-dev-ftp
      PM2_PROCESS: admin-frontend
      PM2_PORT: '6173'
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host deploy
            HostName $REMOTE_HOST
            User $REMOTE_USER
            IdentityFile ~/.ssh/deploy_key
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            ConnectTimeout 30
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Sanity-check SSH + server state
        run: |
          ssh deploy "hostname; id; test -d $REMOTE_PATH && echo 'REMOTE_PATH ok' || (echo 'REMOTE_PATH missing! create it once: sudo -u $SERVICE_USER mkdir -p $REMOTE_PATH'; exit 2)"
          ssh deploy "test -f $REMOTE_PATH/.env && echo 'server .env present (VITE_* vars will be used at build time)' || echo 'WARNING: no .env on server — admin app will fall back to http://localhost:7000'"

      - name: Rsync source
        run: |
          RSYNC_FLAGS="-avz --human-readable"
          if [ "$DRY_RUN" = "true" ]; then
            RSYNC_FLAGS="$RSYNC_FLAGS --dry-run"
            echo "### DRY RUN — no files will be written ###"
          fi
          rsync $RSYNC_FLAGS \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='*.log' \
            --rsync-path="sudo -u $SERVICE_USER rsync" \
            react-admin/ \
            deploy:"$REMOTE_PATH/"

      - name: Install dependencies on server
        if: env.DRY_RUN != 'true'
        # Vite needs the full dep tree to build; npm install is cheap when
        # node_modules is already populated and package.json hasn't changed.
        run: |
          ssh deploy "sudo -u $SERVICE_USER -H bash -lc '\
            source ~/.nvm/nvm.sh && \
            cd $REMOTE_PATH && \
            npm install --no-audit --no-fund'"

      - name: Build on server
        if: env.DRY_RUN != 'true'
        # Server .env supplies VITE_SOCKET_URL — baked into the bundle here.
        run: |
          ssh deploy "sudo -u $SERVICE_USER -H bash -lc '\
            source ~/.nvm/nvm.sh && \
            cd $REMOTE_PATH && \
            npm run build'"

      - name: Restart pm2 process
        if: env.DRY_RUN != 'true'
        run: |
          ssh deploy "sudo -u $SERVICE_USER -H bash -lc '\
            source ~/.nvm/nvm.sh && \
            pm2 restart $PM2_PROCESS --update-env && \
            pm2 save'"

      - name: Health check
        if: env.DRY_RUN != 'true'
        run: |
          sleep 5
          ssh deploy "sudo ss -tlnp | grep ':$PM2_PORT ' || (echo 'port $PM2_PORT not listening'; exit 3)"
          ssh deploy "curl -sS -o /dev/null -w '%{http_code}\n' --max-time 10 http://127.0.0.1:$PM2_PORT/ || (echo 'admin panel not reachable'; exit 4)"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
