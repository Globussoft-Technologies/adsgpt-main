name: Public CI/CD Pipeline Verification

on:
  push:
    branches: [ main ]

jobs:
  # STAGE 1: Verify Code Structure
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Initialize App Runtime Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Unit Frameworks
        run: |
          npm ci
          npm test

  # STAGE 2: Execute Signature Handshake Signal
  trigger-production-pull:
    runs-on: ubuntu-latest
    needs: verify-and-test # Blocks deployment execution if test frameworks encounter a failure
    
    steps:
      - name: Dispatch Secure Webhook Request
        run: |
          # We construct the exact HMAC-SHA256 hash using your secret to sign the body payload payload
          PAYLOAD='{"event": "push", "status": "verified"}'
          SECRET="${{ secrets.WEBHOOK_SECRET_KEY }}"
          
          # Calculate Signature matching GitHub format: sha256=...
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$SECRET" | sed 's/^.* //')
          
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -d "$PAYLOAD" \
            https://${{ secrets.SERVER_IP_OR_DOMAIN }}/hooks/redeploy-app
