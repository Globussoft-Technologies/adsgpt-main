# Announces new CodeQL alerts on main to Telegram, naming the PR that
# introduced each one.
#
# TRIGGER NOTE: `code_scanning_alert` is a webhook event, NOT a valid Actions
# trigger - a workflow using it is rejected by GitHub and shows up as a failed
# run named by its file path on every push. This runs off `workflow_run`
# instead, firing as soon as the CodeQL scan that could have produced new
# alerts finishes.
#
# This repo is a mirror and has no PRs of its own. The PR number is read out of
# the mirror commit message, which the private repo's Jenkinsfile writes as an
# "Upstream PR: #1234" trailer. Nothing here reads the private repo, so there is
# no cross-repo token to leak from a public repo's secrets.
#
# Attribution walks: flagged line -> git blame -> mirror commit -> trailer.
# An alert's own commit_sha is NOT usable for this: it is whichever mirror batch
# CodeQL happened to scan, which names an unrelated PR most of the time.
#
# Setup:
#   Secrets   CODEQL_TELEGRAM_BOT_TOKEN, CODEQL_TELEGRAM_CHAT_ID
#
# Alerts are ON by default - no variable needs to exist. To silence the channel,
# set repo variable CODEQL_TELEGRAM_ENABLED to "false"; any other value, or no
# variable at all, leaves it running. A query-pack upgrade can raise hundreds of
# alerts at once, so the script batches anything above a threshold into a single
# summary message rather than flooding the group.
name: CodeQL alerts to Telegram

on:
  workflow_run:
    workflows: ["CodeQL"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  security-events: read
  actions: read

jobs:
  notify:
    if: vars.CODEQL_TELEGRAM_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git blame needs real history to find the introducing commit.
          fetch-depth: 0

      - name: Report new alerts to Telegram
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Alerts created at or after the moment the CodeQL run started are the
          # ones that scan produced.
          SINCE: ${{ github.event.workflow_run.run_started_at }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.CODEQL_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CODEQL_TELEGRAM_CHAT_ID }}
          PRIVATE_REPO_URL: https://github.com/Globussoft-Technologies/adsgpt
        run: node .github/scripts/codeql-telegram.js
