# CI — fast checks on PRs and pushes.
#
# This workflow runs unit tests for the services that have them.
# It does NOT deploy. Deploy workflows live in .github/workflows/deploy-*.yml
# and depend on this workflow succeeding before they run.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Cancel in-flight runs for the same PR/branch when a new push arrives.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # nodejs-backend: autopilot rule-evaluator tests (node:assert/strict,
  # no framework). Will grow as Phase 2+ lands more tests.
  # -------------------------------------------------------------------------
  nodejs-backend-test:
    name: nodejs-backend / autopilot tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodejs-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
        # Note: no `cache: npm` because the repo doesn't ship package-lock.json
        # files. setup-node treats a missing lock file as a hard error when
        # caching is enabled. Revisit once lock files are committed.

      - name: Install deps
        # npm ci requires package-lock.json; fall back to install if absent.
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Run autopilot tests
        run: npm run test:autopilot

  # -------------------------------------------------------------------------
  # react-frontend: lint. Tests TBD — no framework is wired up in the repo
  # today. Soft-fails for now (|| true) so pre-existing warnings don't block
  # merges. Flip to hard-fail once baselined.
  # -------------------------------------------------------------------------
  react-frontend-lint:
    name: react-frontend / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
        # No cache — see note in the other job.

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Lint
        run: npm run lint || true

  # -------------------------------------------------------------------------
  # react-admin: build check. The admin panel is small and has no test suite
  # yet, but a successful Vite build catches import/syntax breakage on PRs.
  # -------------------------------------------------------------------------
  react-admin-build:
    name: react-admin / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
        # No cache — see note in the nodejs-backend job above.

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build
        # CI build doesn't see the server's .env, so VITE_SOCKET_URL falls
        # back to the localhost default in src/lib/api.js. That's fine for a
        # syntax-and-type smoke check.
        run: npm run build
