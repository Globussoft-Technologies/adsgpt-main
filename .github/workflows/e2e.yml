name: Nightly E2E

on:
  schedule:
    # 03:00 UTC = 08:30 IST every day. Cron drift on GitHub-hosted runners
    # is typically <15 min.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

env:
  E2E_FRONTEND_URL: ${{ secrets.E2E_FRONTEND_URL }}
  E2E_API_URL: ${{ secrets.E2E_API_URL }}
  E2E_LOGIN_URL: ${{ secrets.E2E_LOGIN_URL }}
  E2E_LOGIN_USERNAME: ${{ secrets.E2E_LOGIN_USERNAME }}
  E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}

jobs:
  # ----------------------------------------------------------------
  # Node 1: Login
  # Runs the aMember login once, uploads .auth/frontend.json as an
  # artifact so the downstream jobs don't have to log in again.
  # ----------------------------------------------------------------
  login:
    name: Login
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-e2e

      - name: Run setup-frontend
        run: npx playwright test --project=setup-frontend

      - name: Inspect .auth/ after login
        # Surface exactly what landed on disk so we don't silently upload an
        # empty artifact and have downstream jobs fail with a cryptic "not found".
        run: |
          echo "--- contents of e2e/.auth/ ---"
          ls -la .auth/ || echo "(.auth/ does not exist)"

      - name: Upload auth state
        uses: actions/upload-artifact@v4
        with:
          name: auth-state
          path: e2e/.auth/frontend.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-login-${{ github.run_id }}
          path: e2e/playwright-report/
          retention-days: 14

  # ----------------------------------------------------------------
  # Node 2: Pages smoke (parallel to BrandIQ, downstream of Login)
  # ----------------------------------------------------------------
  pages:
    name: Pages smoke
    needs: login
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-e2e

      - name: Restore auth state
        uses: actions/download-artifact@v4
        with:
          name: auth-state
          path: e2e/.auth/

      - name: Run smoke spec
        run: npx playwright test --project=frontend tests/frontend/smoke.spec.js

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-pages-${{ github.run_id }}
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload traces (on fail)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-pages-${{ github.run_id }}
          path: e2e/test-results/
          retention-days: 14

  # ----------------------------------------------------------------
  # Node 3: BrandIQ CRUD journey (parallel to Pages, downstream of Login)
  # ----------------------------------------------------------------
  brandiq:
    name: BrandIQ CRUD
    needs: login
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-e2e

      - name: Restore auth state
        uses: actions/download-artifact@v4
        with:
          name: auth-state
          path: e2e/.auth/

      - name: Run BrandIQ CRUD spec
        run: npx playwright test --project=frontend tests/frontend/journeys/brandiq-crud.spec.js

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-brandiq-${{ github.run_id }}
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload traces (on fail)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-brandiq-${{ github.run_id }}
          path: e2e/test-results/
          retention-days: 14

  # ----------------------------------------------------------------
  # Node 4: API liveness (independent of Login — no browser needed)
  # ----------------------------------------------------------------
  api:
    name: API liveness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-e2e
        with:
          install-browsers: 'false'

      - name: Run api project
        run: npx playwright test --project=api

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-api-${{ github.run_id }}
          path: e2e/playwright-report/
          retention-days: 14

  # ----------------------------------------------------------------
  # Summary: posts a Slack ping if any prior node failed.
  # Runs even when an upstream job fails (`if: always()`).
  # ----------------------------------------------------------------
  notify:
    name: Notify on failure
    needs: [login, pages, brandiq, api]
    if: always() && (needs.login.result == 'failure' || needs.pages.result == 'failure' || needs.brandiq.result == 'failure' || needs.api.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.E2E_SLACK_WEBHOOK }}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$(cat <<EOF
          {
            "text": ":rotating_light: Nightly E2E failed",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Nightly E2E failed* — login=${{ needs.login.result }}, pages=${{ needs.pages.result }}, brandiq=${{ needs.brandiq.result }}, api=${{ needs.api.result }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>"
                }
              }
            ]
          }
          EOF
          )" \
            "$SLACK_WEBHOOK_URL"
