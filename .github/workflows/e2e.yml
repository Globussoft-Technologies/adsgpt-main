name: Nightly E2E

on:
  schedule:
    # 03:00 UTC daily. Cron drift on GitHub-hosted runners is typically <15 min.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      project:
        description: 'Playwright project filter (frontend | api). Empty = all.'
        type: string
        default: ''

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    env:
      E2E_FRONTEND_URL: ${{ secrets.E2E_FRONTEND_URL }}
      E2E_API_URL: ${{ secrets.E2E_API_URL }}
      E2E_FRONTEND_JWT: ${{ secrets.E2E_FRONTEND_JWT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install JS deps
        # e2e/ may not ship a lockfile initially — fall back to install.
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Bump the suffix to bust the cache if Playwright misbehaves.
          key: pw-browsers-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}-v1

      - name: Install Playwright browsers
        # Always install system deps (apt packages aren't cached); skip the
        # browser binaries if the cache already has them.
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run Playwright
        # Empty input → run everything. Otherwise pass --project=<name>.
        run: |
          if [ -n "${{ github.event.inputs.project }}" ]; then
            npx playwright test --project="${{ github.event.inputs.project }}"
          else
            npx playwright test
          fi

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload traces & screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}
          path: e2e/test-results/
          retention-days: 14

      - name: Notify Slack on failure
        # Opt-in: only fires if you set the webhook secret.
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.E2E_SLACK_WEBHOOK }}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$(cat <<EOF
          {
            "text": ":rotating_light: Nightly E2E failed",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Nightly E2E failed* — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>"
                }
              }
            ]
          }
          EOF
          )" \
            "$SLACK_WEBHOOK_URL"
